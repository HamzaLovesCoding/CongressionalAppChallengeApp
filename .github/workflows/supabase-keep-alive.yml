# The free Supabase plan pauses a project after about a week without activity, which would take the
# backend down while judges are still trying the app. A query every 3 days keeps it awake, and a failed
# run emails the repo owner if the project is paused or unreachable anyway.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 9 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query the database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          # Signed-out callers get 42501 from Postgres itself, so this still reaches the database
          # without creating a throwaway anonymous user on every run.
          body=$(curl -sS --max-time 30 -X POST "$SUPABASE_URL/rest/v1/rpc/weekly_leaderboard" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" -H "Content-Type: application/json" -d '{}')
          echo "$body"
          echo "$body" | grep -q '"code":"42501"\|^\[' || { echo "Supabase did not answer from Postgres"; exit 1; }
